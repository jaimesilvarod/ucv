name: Full Backup With Forensics Artifacts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install supabase

      - name: Download Forensics Monitor artifacts
        run: |
          mkdir -p downloaded_artifacts

          gh run list \
            --workflow "Forensics Monitor" \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId' > runs.txt

          while read run_id; do
            echo "Downloading artifacts from run $run_id"
            mkdir -p "downloaded_artifacts/run_$run_id"
            gh run download "$run_id" \
              --dir "downloaded_artifacts/run_$run_id" || true
          done < runs.txt

      - name: Run database backup
        run: |
          python backup_once.py

      - name: Merge DB backup and workflow artifacts
        run: |
          mkdir -p final_backup
          cp backup_aurora_*.zip final_backup/
          cp -r downloaded_artifacts final_backup/

          FINAL_ZIP="aurora_complete_backup_$(date -u +%Y%m%d_%H%M%S).zip"
          zip -r "$FINAL_ZIP" final_backup

          echo "FINAL_ZIP=$FINAL_ZIP" >> $GITHUB_ENV

      - name: Upload complete backup
        uses: actions/upload-artifact@v4
        with:
          name: aurora-complete-backup
          path: ${{ env.FINAL_ZIP }}
          retention-days: 90
